<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="assist">
  <!-- Full-bleed opaque background: maskable + apple-touch-icon need edge-to-edge
       fill so the platform can apply its own rounding/mask without transparent gaps.
       The glyph sits well within the central 80% safe zone. -->
  <rect width="512" height="512" fill="#0f172a" />
  <text x="50%" y="50%" dy="0.07em" text-anchor="middle" dominant-baseline="middle"
        font-family="ui-sans-serif, system-ui, sans-serif" font-size="280" font-weight="700"
        fill="#38bdf8">a</text>
</svg>
